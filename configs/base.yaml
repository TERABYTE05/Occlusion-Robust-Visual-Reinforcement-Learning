env:
  id: FetchPushDense-v3
  camera: v1
  image_size: 84
  frame_stack: 3
  pixels: true
  occlusion: none

train:
  steps: 500000
  seed_steps: 4000
  batch_size: 256
  checkpoint_every: 50000
  eval_every: 10000
  eval_episodes: 10
  amp: true

agent:
  lr: 0.0001
  feature_dim: 128
  hidden_dim: 512
  nstep: 3
  discount: 0.99
  polyak: 0.01
  aug_pad: 4
  stddev_schedule: "linear(1.0,0.1,100000)"
  stddev_clip: 0.3

  fusion: concat
  normalization: none
  simplexnorm:
    partitions: 16
    per_partition: 8
    tau: 1.0

buffer:
  capacity: 100000
  nstep: 3
